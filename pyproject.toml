[project]
name = "lifemate"
version = "0.1.0"
description = "ZAIC 2026 LifeMate: pipeline mô-đun, mỗi tầng đổi phương án bằng config"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2.2",
    "openai>=1.40",
    "soundfile>=0.12",
    "jiwer>=3.0",
]

[project.optional-dependencies]
asr = [
    "torch>=2.7",
    "transformers>=4.48,<5",
    "accelerate>=1.0",
    "faster-whisper>=1.1",
]
chunkformer = ["chunkformer", "torchaudio>=2.7"]
train = ["peft>=0.13"]  # fine-tune ASR: scripts/finetune_*.py
app = ["streamlit>=1.40", "altair>=5"]
sft = ["torch>=2.7", "transformers>=4.48,<5", "accelerate>=1.0", "peft>=0.13"]
dev = ["pytest>=8", "ruff>=0.14", "pre-commit>=4"]

[project.scripts]
lifemate = "lifemate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifemate"]

# RTX 50xx (sm_120) cần torch dựng với CUDA 12.8 trở lên
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["models", "runs", "cache", "sft", "logs", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # pinned so a ruff upgrade does not change what passes
ignore = ["E731"]  # small local helpers are written as lambdas
