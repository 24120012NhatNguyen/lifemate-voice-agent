# Lộ trình đề xuất và trạng thái. Tab "Lộ trình" của app/compare.py đọc file này và tự gắn điểm từ runs/.
# Nấc và ý tưởng lấy từ docs/PROPOSAL.md mục 5 và 6; đề xuất mới rút ra từ kết quả (docs/BASELINE.md).
# Sửa trực tiếp ở đây, hoặc ở bảng "Đề xuất tiếp theo" trên web-app (nút Lưu ghi lại cả file, chỉ giữ chú thích đầu file).
# status: xong | đang làm | chưa làm | bỏ. configs: mẫu tên config (glob) có kết quả làm bằng chứng.
rungs:
- id: '0'
  name: Khung đo
  status: xong
  gate: Chạy lại call gold của train ra 100 điểm, state khớp final_state ở mọi mẫu
  configs: ['00_*', '01_*', '02_*']
  note: Oracle qua middleware mặc định ra 100; middleware kiểu HTML làm mất 4,5 điểm.
- id: '1'
  name: Baseline nộp được
  status: xong
  gate: File nộp hợp lệ, dưới 30 giây mỗi mẫu, có số đo gốc trên cả hai tập kiểm định
  configs: ['10_*', '11_*', '12_*', '3[0-3]_*', '90_*']
  note: Qwen3-4B chỉ dùng prompt được 34,2 trên val_random, 36,1 trên val_app. Bản nộp public đầu tiên (config 90, PhoWhisper-ft rồi SFT) được 42,15, khớp trung bình val_random và val_app (42,2); SFT trên cả train (91) được 44,70. Chưa đo trên A30, chưa có Docker.
- id: '2'
  name: Tất định hoá phần đụng hash
  status: đang làm
  gate: Không còn call bị từ chối; số mẫu sai hash vì ngày giờ và số tiền giảm rõ so với nấc 1
  configs: ['13_*', '14_*', '16_*', '17_*', '18_*', '19_*', '7[0-3]_*']
  note: Đã có bảng lịch, schema nén, sổ ghi lịch sử, giải mã theo schema, server tất định. Máy tính ẩn sys.calc (70-73) không giúp vì mô hình gần như không gọi (2/400 lượt).
- id: '3'
  name: Tinh chỉnh LLM (SFT)
  status: đang làm
  gate: Điểm val_app tiệm cận val_random; precision và recall call đọc đều tăng
  configs: ['4[0-9]_*', '5[0-3]_*', '6[0167]_*', '8[0-7]_*', '99_*']
  note: SFT lên 61,0 / 42,9, khoảng cách tăng 19,9 điểm. Đổi tên, gỡ app giữ lại đều không thu hẹp. Chỉ đổi seed đã lệch 1,2 điểm (độ lệch chuẩn, cả tập); fp16 trên T4 ngang bf16. Thêm 600 mẫu app tổng hợp (99_*, 4 seed) được 58,8 / 51,4 trên cả tập, khoảng cách còn 7,3 điểm (không synth 9,9). Chưa đạt cổng.
- id: '4'
  name: Các ý tưởng khác biệt (5.1, 5.3, 5.4)
  status: chưa làm
  gate: Gần như không còn mẫu sai hash vì ID; điểm tăng từ bỏ phiếu lớn hơn rủi ro thời gian
  configs: []
- id: '5'
  name: ASR theo thực thể
  status: đang làm
  gate: Khoảng cách giữa chạy bằng audio_text gold và bằng ASR thu hẹp
  configs: ['2[0-9]_asr_*', '3[0-9]_*', '5[4-7]_*', '6[2-589]_*']
  note: Fine-tune LoRA bằng scripts/finetune_whisper.py, WER 20,5 → 9,3. Ghép với agent SFT được 51,8 / 32,5 (54/55), ASR vẫn mất khoảng 10 điểm. ChunkFormer-ft ghép kém hơn 10 điểm vì ra chữ thường, số viết bằng chữ.
- id: '6'
  name: Cứng hoá cho private
  status: chưa làm
  gate: Chạy hai lần cả public trong Docker ra cùng file nộp; p99 dưới 30 giây có biên an toàn
  configs: []
ideas:
- id: '5.1'
  name: Tham số có nguồn gốc, LLM chọn chứ không gõ
  status: chưa làm
  configs: ['16_*']
  note: 16 (chặn hẳn ID chưa thấy) là bản thô, +2,9 điểm.
- id: '5.2'
  name: Chính sách đọc học từ dữ liệu, suy rộng bằng x-ref
  status: đang làm
  configs: ['10_*', '13_*']
  note: Luật khai thác từ dữ liệu (prompts/rules/verified.md) hơn luật tối thiểu 2,5 điểm.
- id: '5.3'
  name: Bỏ phiếu trên tập lệnh ghi
  status: chưa làm
  configs: []
- id: '5.4'
  name: Làm, hỏi hay đứng yên theo kỳ vọng điểm
  status: chưa làm
  configs: []
  note: Sau SFT, lỗi lớn nhất trên val_app là đứng yên khi phải làm (12 mẫu).
- id: '5.5'
  name: Huấn luyện để đọc schema, không để nhớ app
  status: đang làm
  configs: ['42_*', '43_*', '99_*']
  note: Đổi tên 50% chưa giúp; 53% mẫu train có cài app giữ lại mà gold không bao giờ gọi. App tổng hợp kiểu CRUD (99_*) giúp rõ, so cùng seed val_app +4,5 ± 1,0 và tăng ở cả 4 seed.
- id: '5.6'
  name: ASR gắn với thực thể
  status: đang làm
  configs: ['25_*', '27_*', '28_*', '29_*']
  note: Luật sửa âm vị làm giảm độ giữ thực thể; fine-tune giúp rõ.
proposals:
- priority: 1
  name: Nối ASR fine-tune với agent SFT (configs 54-57)
  why: 'Đã đo: PhoWhisper-ft rồi SFT được 51,8 / 32,5, tăng 27,9 so với pipeline gốc; ASR vẫn mất khoảng 10 điểm ở cả hai tập'
  cost: 20 phút GPU
  status: xong
- priority: 2
  name: SFT không có app giữ lại trong schema (configs 44-53)
  why: 'Đã đo: gỡ app giữ lại (drop) −4,9 ± 3,8 / −0,4 ± 3,0 so với SFT, đổi tên mọi mẫu thêm −3,7 / −1,0, nên val_app không tăng (hiệu trong dao động theo seed). t4-check: fp16 trên T4 ngang bf16'
  cost: Kaggle T4 x2, khoảng 4 giờ mỗi đợt
  status: bỏ
- priority: 3
  name: SFT trên bản chép ASR (configs 60-63, thử lại 66-69)
  why: 'Lần 1: nhiễu 2 dB (WER 14,3) trộn 50% làm nghe đúng tụt 9,1 điểm trên val_random; đầu-cuối 40,8 so với 42,2. Lần 2: nhiễu 5 dB, giữ thực thể: đầu-cuối 39,3, phần mất do ASR vẫn khoảng 10 điểm'
  cost: 2,5 giờ GPU
  status: bỏ
- priority: 4
  name: Suy nghĩ ngắn trong đáp án SFT
  why: thought đang để trống; lập luận tool nào khớp yêu cầu có thể bớt việc dừng ngay ở app mới
  cost: 2,5 giờ GPU và công dựng thought
  status: chưa làm
- priority: 5
  name: App tổng hợp kiểu CRUD khi huấn luyện
  why: 'Public có 11/36 app không có trong train (65% mẫu); app giả giúp mô hình quen đọc schema mới. Đã đo (configs 99_*, 4 seed, cả tập): so cùng seed không synth, val_random +1,9 ± 1,1, val_app +4,5 ± 1,0, trung bình hai tập +3,2; lượt synth kém nhất vẫn hơn lượt không synth tốt nhất. Đưa vào công thức SFT; bộ sinh còn thiếu ca chọn theo chi tiết khi search ra nhiều mục và giá trị phải đọc hay tính ra'
  cost: 1-2 ngày code
  status: xong
- priority: 6
  name: Step-DPO hoặc GRPO trên ToolEnv
  why: Học từ phần thưởng điểm thật thay vì chỉ bắt chước gold
  cost: vài ngày
  status: chưa làm
- priority: 7
  name: Fine-tune lại trên toàn bộ 1.545 mẫu khi nộp (configs 91, 92, 94)
  why: 'Thêm khoảng 50% dữ liệu đã có nhãn sẵn, không phải nghe. Đã đo public: 91 (fp16 Kaggle) 44,70, 94 (bf16 máy nhà) 43,17, v1 42,15. Thêm dữ liệu chỉ +1,8 trung bình, cỡ dao động seed: 65% mẫu public dùng app chưa có trong train. Bản chính 91'
  cost: Kaggle T4, khoảng 1,5 lần một lượt train_rest
  status: xong
- priority: 8
  name: Beam search 4 cho PhoWhisper-ft (configs 64, 65)
  why: 'Đã đo: WER và độ giữ thực thể không đổi (val_random 11,1 → 11,3), đầu-cuối 42,2 → 42,0, ASR chậm gấp 4. Giữ greedy'
  cost: 30 phút GPU
  status: bỏ
- priority: 9
  name: Máy tính ẩn sys.calc cho ngày giờ và số (configs 70-73)
  why: 'Đã đo: so với t4-check −0,7 ± 2,6 / +1,0 ± 3,6. Mô hình chỉ gọi sys.calc 2/400 lượt (6,3% mẫu train có bước calc), cả hai sai; máy tính chưa nhận thời lượng ghép như 1h20m'
  cost: 2 giờ GPU
  status: bỏ
- priority: 10
  name: Gộp vài seed của agent SFT (configs 52, 53, 80-87)
  why: 'Đã đo: chỉ đổi seed, trung bình hai tập lệch 50,6-53,6 (độ lệch chuẩn 1,2 trên cả tập, 2,2 trên 100 mẫu). Seed tốt trên train_rest chưa chắc tốt khi học cả train; trung bình trọng số LoRA của vài seed hoặc bỏ phiếu giữa chúng có thể bớt dao động. Mọi so sánh công thức về sau cần cả tập hoặc vài seed'
  cost: Kaggle T4, 4 giờ mỗi cặp seed
  status: chưa làm
