# Đầu-cuối khi cả hai tầng đã tinh chỉnh: PhoWhisper-large fine-tune (như 29) rồi Qwen3-4B SFT (như 40).
# So với 40 (cùng agent, nghe đúng hoàn toàn) và 31 (cả hai chưa tinh chỉnh). Mô hình ASR do scripts/finetune_whisper.py
# ghi vào models/. Server: `DETERMINISTIC=1 MODEL=models/qwen3-4b-sft scripts/serve_vllm.sh`.
extends: ../base.yaml
subset: val_random
asr: {name: hf_whisper, model: models/phowhisper-large-ft, num_beams: 1, batch_size: 16}
agent:
  llm: {model: models/qwen3-4b-sft}
