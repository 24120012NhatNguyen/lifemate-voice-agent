# Tạo file nộp public_test với tổ hợp đang tốt nhất (54/55): PhoWhisper-large fine-tune rồi Qwen3-4B SFT.
# Chạy 29_asr_phowhisper-large-ft_public trước, rồi `scripts/gpu_job.sh eval models/qwen3-4b-sft` config này;
# file nộp là runs/<lượt>/predictions.jsonl, kiểm bằng `lifemate validate runs/<lượt>`.
extends: ../base.yaml
split: public_test
subset: all
asr: {name: hf_whisper, model: models/phowhisper-large-ft, num_beams: 1, batch_size: 16}
agent:
  llm: {model: models/qwen3-4b-sft}
