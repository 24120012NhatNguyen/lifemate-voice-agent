# Docker bản cuối (LM-50, Pro 13/11 01:23): cấu hình public 98f (98r5 = 98r3 + cờ guard của 198; ASR chính ft-all
# N-best 4, ASR ghép ft2-all greedy có mồi profile_history_apps) + guards.empty_retry, chạy tuần tự, time_budget 25 s.
# Hai ASR là MỘT PhoWhisper-large gốc + hai adapter LoRA hạng 32 tách lại từ bản gộp (scripts/whisper_lora_extract.py),
# để tổng tham số dưới 6 tỷ. LLM đổi lúc dựng bằng LLM=… (tạm model 98f; bản soup nhiều seed thay vào sau).
#   ASR=models/phowhisper-large-base ADAPTERS="models/phowhisper-large-ft-all-lora models/phowhisper-large-ft2-all-lora" \
#   APP_RANK=models/app_rank_train.json LLM=models/qwen35-4b-sft-full-para-v1-asrfold CONFIG=configs/docker-final.yaml \
#   TAG=lifemate:final scripts/docker_build.sh
# ASR ghép chỉ góp bản chép lượt cuối: history false (mồi lấy từ hồ sơ và lịch sử của mẫu, không từ bản chép lịch sử).
extends: experiments/98f_submit_public_qwen35-full-para-v1-asrfold_asr2_rules198.yaml
subset: all
workers: 1
asr:
  model: models/phowhisper-large-base
  adapter: models/phowhisper-large-ft-all-lora
  merge_with: {model: models/phowhisper-large-base, adapter: models/phowhisper-large-ft2-all-lora, history: false}
guards: {empty_retry: true, calendar_create_end: true}
agent:
  time_budget: 25
  # Ngưỡng hỏi lại (Pro 14/11, config 243): trước lệnh ghi đầu, câu hỏi lại về tool của app KHÔNG có trong train mà p_ask < 0,7
  # thì sinh lại với hỏi lại và stop bị cấm; tối đa 2 lần mỗi mẫu; không đụng stop. Val: +1,03 val_app (12 mẫu, tốt 5 / tệ 1),
  # 0 mẫu val_random. known ghi tường minh (app có call gold trong train) vì image không mang dữ liệu train.
  decision:
    record: true
    mode: threshold
    scope: pre_write
    ask_min: 0.7
    stop_min: 0.0
    later_ask_min: 0.7
    later_stop_min: 0.0
    max_overrides: 2
    ask_apps: unseen
    known: [alarm, appliances, banking, bike_rental, bill_payment, calculator, calendar, chat_ott, contacts, door_lock, email, ewallet, exchange_rate, fitness, flights, food_delivery, fuel_price, gold_price, home_automation, home_energy, home_security, household_chores, learning, library, lottery, loyalty, maps, medication, music, news, notes, package_tracking, phone, podcast_radio, reminders, ride_hailing, robot_vacuum, shopping_list, smart_home, sms, subscriptions, sys, tasks, tv, video_meeting, weather]
